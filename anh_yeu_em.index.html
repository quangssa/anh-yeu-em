<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Anh yêu em ❤️</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:grid;place-items:center;text-align:center;font:20px system-ui;color:white;background:radial-gradient(circle,#ffb6cf,#d92b68 55%,#35051f)}main{padding:35px 22px;border-radius:28px;background:#ffffff20;backdrop-filter:blur(12px);box-shadow:0 20px 70px #30001f80}h1{font-size:clamp(55px,14vw,100px);margin:12px 0;animation:p 1.4s infinite}small{letter-spacing:4px}i{position:fixed;left:50%;top:52%;font-style:normal;pointer-events:none;animation:x 2.7s ease-out forwards}@keyframes p{50%{transform:scale(1.08)}}@keyframes x{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(var(--s));opacity:0}}</style><main><small>CÓ MỘT ĐIỀU ANH MUỐN NÓI...</small><h1>Anh yêu em ❤️</h1><div>Không cần lý do, không cần dịp đặc biệt.<br>Chỉ là hôm nay anh muốn em biết điều đó.</div><p>✨ Chạm vào màn hình ✨</p></main><script>let H="❤️💗💖💕💘💓💞💝";function f(X=innerWidth/2,Y=innerHeight/2){let e=document.createElement("i");e.textContent=H[Math.random()*H.length|0];e.style.left=X+"px";e.style.top=Y+"px";let a=Math.random()*6.28,d=100+Math.random()*400;e.style.setProperty("--x",Math.cos(a)*d+"px");e.style.setProperty("--y",Math.sin(a)*d+"px");e.style.setProperty("--r",Math.random()*100-50+"deg");e.style.setProperty("--s",.6+Math.random()*1.5);document.body.append(e);setTimeout(()=>e.remove(),2800)}setInterval(f,500);onclick=e=>{for(let i=0;i<18;i++)setTimeout(()=>f(e.clientX,e.clientY),i*25)};</script>
